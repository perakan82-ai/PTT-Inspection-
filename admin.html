<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>แอดมิน • ระบบประเมินมาตรฐานปั๊ม</title>
  <meta name="robots" content="noindex" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-[#1F1F1F] text-white px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <h1 class="font-bold">⚙️ แอดมิน • ระบบประเมินมาตรฐานปั๊ม</h1>
      <button id="logoutBtn" class="hidden text-sm opacity-80 hover:opacity-100">ออกจากระบบ</button>
    </div>
  </header>

  <!-- Login -->
  <section id="login" class="max-w-sm mx-auto mt-16 bg-white rounded-2xl shadow p-6">
    <h2 class="font-bold text-lg mb-3">เข้าสู่ระบบแอดมิน</h2>
    <input id="keyInput" type="password" placeholder="ADMIN_KEY" class="w-full border rounded-lg px-3 py-2" />
    <button id="loginBtn" class="w-full mt-3 py-2.5 rounded-lg bg-[#06C755] text-white font-bold">เข้าสู่ระบบ</button>
  </section>

  <main id="main" class="hidden max-w-5xl mx-auto p-4 space-y-6">
    <!-- Tabs -->
    <div class="flex gap-2">
      <button data-tab="employees" class="tab px-4 py-2 rounded-lg font-semibold">👥 พนักงาน</button>
      <button data-tab="daily" class="tab px-4 py-2 rounded-lg font-semibold">📊 สรุปรายวัน</button>
      <button data-tab="history" class="tab px-4 py-2 rounded-lg font-semibold">📋 ประวัติการประเมิน</button>
      <button id="testNotify" class="ml-auto px-4 py-2 rounded-lg bg-white border text-sm">🔔 ทดสอบแจ้งเตือน</button>
    </div>

    <!-- Employees -->
    <section id="tab-employees" class="space-y-4">
      <form id="addForm" class="bg-white rounded-2xl shadow-sm p-4 grid md:grid-cols-[auto_1fr_1fr_1fr_auto] gap-3 items-end">
        <label class="cursor-pointer flex flex-col items-center">
          <div id="addPreview" class="w-20 h-20 rounded-full bg-gray-100 border-2 border-dashed flex items-center justify-center text-2xl overflow-hidden">📷</div>
          <span class="text-xs text-gray-500 mt-1">รูปพนักงาน</span>
          <input id="addPhoto" type="file" accept="image/*" class="hidden" />
        </label>
        <div><label class="text-xs text-gray-500">ชื่อ-นามสกุล *</label><input name="name" required class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label class="text-xs text-gray-500">ชื่อเล่น</label><input name="nickname" class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label class="text-xs text-gray-500">ตำแหน่ง</label>
          <input name="position" list="positions" class="w-full border rounded-lg px-3 py-2" placeholder="เช่น พนักงานเติมน้ำมัน" />
          <datalist id="positions"><option>ผู้จัดการกะ</option><option>กัปตัน</option><option>แคชเชียร์</option><option>พนักงานเติมน้ำมัน</option></datalist>
        </div>
        <button class="px-5 py-2.5 rounded-lg bg-[#06C755] text-white font-bold">+ เพิ่ม</button>
      </form>
      <div id="empList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </section>

    <!-- Daily summary -->
    <section id="tab-daily" class="hidden space-y-4">
      <div class="bg-white rounded-2xl shadow-sm p-4 flex flex-wrap items-end gap-3">
        <div>
          <label class="text-xs text-gray-500 block">วันที่</label>
          <div class="flex gap-1">
            <button id="dayPrev" class="px-3 py-2 rounded-lg bg-gray-100">‹</button>
            <input id="dailyDate" type="date" class="border rounded-lg px-3 py-2" />
            <button id="dayNext" class="px-3 py-2 rounded-lg bg-gray-100">›</button>
          </div>
        </div>
        <label class="flex items-center gap-2 text-sm pb-2"><input id="onlyPending" type="checkbox" /> แสดงเฉพาะคนที่ยังไม่ได้ประเมิน</label>
        <div class="ml-auto flex gap-2">
          <button id="dailyCsv" class="px-4 py-2 rounded-lg bg-white border text-sm">⬇️ CSV</button>
          <button id="dailySend" class="px-4 py-2 rounded-lg bg-[#06C755] text-white text-sm font-semibold">ส่งสรุปเข้า LINE</button>
        </div>
      </div>
      <div id="dailyCards" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
      <div id="dailyShifts" class="grid md:grid-cols-3 gap-3"></div>
      <div class="bg-white rounded-2xl shadow-sm overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-gray-600">
            <tr>
              <th class="text-left p-3">พนักงาน</th>
              <th class="p-3">กะเช้า</th>
              <th class="p-3">กะบ่าย</th>
              <th class="p-3">กะดึก</th>
              <th class="p-3">สถานะวันนี้</th>
            </tr>
          </thead>
          <tbody id="dailyRows"></tbody>
        </table>
      </div>
    </section>

    <!-- History -->
    <section id="tab-history" class="hidden space-y-3"></section>
  </main>

  <!-- Edit modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <form id="editForm" class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3">
      <h3 class="font-bold">แก้ไขพนักงาน</h3>
      <label class="cursor-pointer flex flex-col items-center">
        <div id="editPreview" class="w-24 h-24 rounded-full bg-gray-100 overflow-hidden flex items-center justify-center"></div>
        <span class="text-xs text-[#06C755] mt-1 font-semibold">เปลี่ยนรูป</span>
        <input id="editPhoto" type="file" accept="image/*" class="hidden" />
      </label>
      <input name="name" required class="w-full border rounded-lg px-3 py-2" placeholder="ชื่อ-นามสกุล" />
      <input name="nickname" class="w-full border rounded-lg px-3 py-2" placeholder="ชื่อเล่น" />
      <input name="position" list="positions" class="w-full border rounded-lg px-3 py-2" placeholder="ตำแหน่ง" />
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="active" /> ใช้งานอยู่ (แสดงในรายชื่อเข้ากะ)</label>
      <div class="flex gap-2 pt-2">
        <button type="button" id="cancelEdit" class="flex-1 py-2.5 rounded-lg bg-gray-100 font-semibold">ยกเลิก</button>
        <button class="flex-1 py-2.5 rounded-lg bg-[#06C755] text-white font-bold">บันทึก</button>
      </div>
    </form>
  </div>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
